# There are no tests in this project. This check answers one question:
#
#     does your code still compile?
#
# A green check means Java accepted it. It does NOT mean your output is right.
# Only you can check that, by running the program and reading the README.
name: compiles

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: ./mvnw -B compile
